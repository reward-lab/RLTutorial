<title>Gridworld RL Lecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: 1600×900 slide scaled to fit the window. Header (kicker + title) on top; left column = talking points that build in one by one + live readout; right column = the gridworld animation; slim footer with progress and tucked-away transport. */
:root{
  --bg:#d9dfe4; --surface:#f8fafb; --ink:#15222c; --muted:#5a6a77; --line:#cfd8df;
  --cell:#eef2f4; --wall:#2b3946; --agent:#1d6bd0; --pos:#14936a; --neg:#d4442a; --hl:#e9a40c;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070b0f; --surface:#111a22; --ink:#e6edf2; --muted:#90a2b0; --line:#273643;
  --cell:#1a2530; --wall:#4a5d6d; --agent:#5aa0ff; --pos:#35c48a; --neg:#ff6b4f; --hl:#ffc23d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070b0f; --surface:#111a22; --ink:#e6edf2; --muted:#90a2b0; --line:#273643;
  --cell:#1a2530; --wall:#4a5d6d; --agent:#5aa0ff; --pos:#35c48a; --neg:#ff6b4f; --hl:#ffc23d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
:fullscreen body,body.fs{padding:0}
.viewport{position:relative;height:100%;overflow:hidden}
.deck{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));
  background:var(--surface);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.18);
  display:grid;grid-template-rows:auto 1fr auto;padding:52px 80px 0;overflow:hidden}
header.sh{display:flex;flex-direction:column;gap:6px;min-height:118px}
.kicker{font:600 17px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--agent)}
h2{font:600 58px/1.08 var(--font-math);margin:0;text-wrap:balance;letter-spacing:-.005em}
.body{display:grid;grid-template-columns:640px 1fr;gap:64px;min-height:0;padding-top:18px}
.left{display:flex;flex-direction:column;gap:22px;min-width:0;min-height:0;overflow:hidden}
.pts{display:flex;flex-direction:column;gap:16px;margin:0;padding:0;list-style:none}
.pt{font:400 27px/1.38 var(--font-ui);opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
.pt.on{opacity:1;transform:none}
.pt.txt{padding-left:26px;position:relative}
.pt.txt::before{content:"";position:absolute;left:2px;top:.62em;width:10px;height:10px;border-radius:50%;background:var(--agent)}
.pt.eq{font:32px/1.45 var(--font-math);padding:8px 0 8px 24px;border-left:3px solid var(--agent)}
.pt.eq div+div{margin-top:2px}
.pt.eq.sm{font-size:25px}
.visual{flex:1;min-height:0;display:grid;place-items:center}
.visual svg{width:100%;height:100%}
.tax .edge{stroke:var(--line);stroke-width:2.5;fill:none}
.tax .edge.dash{stroke-dasharray:6 6}
.tax .node rect{fill:var(--cell);stroke:var(--line);stroke-width:1.5}
.tax .node.root rect{stroke:var(--agent);stroke-width:2.5}
.tax .node text{font:600 17px var(--font-ui);fill:var(--ink)}
.tax .leaf text{font:16px var(--font-mono);fill:var(--muted)}
.tax .leaf rect{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.tax .cap{font:italic 15px var(--font-math);fill:var(--muted)}
.tax g.br{transition:opacity .4s}
.tax g.br.dim{opacity:.18}
.code{margin:0;width:100%;font:16px/1.5 var(--font-mono);background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:20px 24px;overflow:hidden;white-space:pre}
.code .ln{display:block;min-height:1.5em;opacity:.3;transition:opacity .35s}
.code .ln.on{opacity:1}
.code .kw{color:var(--agent);font-weight:600} .code .cm{color:var(--muted);font-style:italic}
i{font-family:var(--font-math)}
.left.anim .pts .pt.on{animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.cover h2{font-size:92px;line-height:1.02}
.cover .sub{font:400 30px/1.4 var(--font-ui);color:var(--muted);margin-top:22px}
.cover .meta{font:500 18px var(--font-mono);color:var(--muted);margin-top:40px;letter-spacing:.04em}
.left.cover{justify-content:center;padding-bottom:60px}
.right{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.cvwrap{position:relative;flex:1;min-height:0}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;justify-content:center;min-height:52px;opacity:.75;transition:opacity .2s}
.controls:hover,.controls:focus-within{opacity:1}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl .lab,.ctl label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.ctl output{font-family:var(--font-mono);color:var(--ink)}
.seg{display:flex;gap:3px}
.seg button{font:500 14px var(--font-ui);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
input[type=range]{width:170px;accent-color:var(--agent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.live{font-size:19px;display:flex;flex-direction:column;gap:10px;min-width:0}
.live:empty{display:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.big{font:600 34px var(--font-mono);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:40px}
.stats .muted{font-size:15px}
table.t{border-collapse:collapse;font:17px var(--font-mono);font-variant-numeric:tabular-nums}
table.t th{font:600 14px var(--font-ui);color:var(--muted);text-align:right;border-bottom:1px solid var(--line);padding:3px 12px}
table.t td{text-align:right;padding:3px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;font:16px var(--font-mono)}
.chips span{padding:1px 7px;border-radius:4px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.chips span.a{background:color-mix(in srgb,var(--agent) 18%,transparent)}
.chips span.slip{background:color-mix(in srgb,var(--neg) 25%,transparent)}
.bars{display:grid;grid-template-columns:30px 320px 64px;gap:6px 12px;align-items:center;font:19px var(--font-mono)}
.bar{height:18px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--agent);transition:width .3s}
.bars .on{color:var(--hl);font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.loop{width:380px}
.loop text{font:19px var(--font-math);fill:var(--ink)}
.loop .box{fill:var(--cell);stroke:var(--line);stroke-width:1.5}
.loop .flow path{fill:none;stroke:var(--line);stroke-width:4;transition:stroke .15s}
.loop .flow polygon{fill:var(--line);transition:fill .15s}
.loop .flow.on path{stroke:var(--agent)} .loop .flow.on polygon{fill:var(--agent)}
.obsrow{display:flex;gap:24px;align-items:center}
.obs{display:grid;grid-template-columns:repeat(3,40px);gap:4px}
.obs div{height:40px;border-radius:5px;display:grid;place-items:center;font:600 16px var(--font-mono);background:var(--cell);border:1px solid var(--line)}
.obs .w{background:var(--wall)} .obs .g{background:color-mix(in srgb,var(--pos) 40%,var(--cell))} .obs .l{background:color-mix(in srgb,var(--neg) 40%,var(--cell))}
.obs .x{background:transparent;border-style:dashed} .obs .me{outline:3px solid var(--agent)}
.compass{display:grid;grid-template-columns:repeat(3,52px);gap:5px}
.compass div{height:52px;display:grid;place-items:center;border-radius:8px;font-size:26px}
.compass .k{border:1px solid var(--line)} .compass .k.on{background:var(--hl);border-color:var(--hl);color:#15222c}
.pc{width:560px;height:160px;display:block}
.calc{font:18px/1.6 var(--font-mono);font-variant-numeric:tabular-nums}
.calc .qs{display:flex;gap:18px;margin-top:6px}
.calc .qs span{padding:0 6px;border-radius:4px}
.calc .qs span.on{background:color-mix(in srgb,var(--hl) 35%,transparent)}
.calc .tot{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:600}
footer{display:grid;grid-template-columns:auto 1fr auto auto;gap:24px;align-items:center;height:58px;color:var(--muted);font:14px var(--font-mono)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--agent);transition:width .4s}
.tp{display:flex;gap:4px;opacity:.45;transition:opacity .2s}
.tp:hover,.tp:focus-within{opacity:1}
.tp button{font:16px var(--font-ui);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;min-width:34px;height:32px;cursor:pointer}
.tp button:hover{border-color:var(--line)}
.notes{position:absolute;left:80px;right:80px;bottom:66px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 22px;
  font:20px/1.45 var(--font-ui);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.notes b{font:600 13px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--agent);display:block;margin-bottom:4px}
@media (prefers-reduced-motion: reduce){.pt,.bar i,.prog i{transition:none}.left.anim .pts .pt.on{animation:none}}
</style>

<div class="viewport" id="vp">
  <div class="deck" id="deck">
    <header class="sh" id="sh"><div class="kicker" id="kicker"></div><h2 id="title"></h2></header>
    <div class="body">
      <div class="left" id="left"><ul class="pts" id="pts"></ul><div id="extra"></div><div class="live" id="live"></div></div>
      <div class="right"><div class="visual" id="visual" hidden></div><div class="cvwrap" id="stage"><canvas id="cv" aria-label="Gridworld animation"></canvas></div><div class="controls" id="controls"></div></div>
    </div>
    <footer>
      <span id="partlbl"></span>
      <div class="prog"><i id="progbar"></i></div>
      <span id="count" class="mono"></span>
      <div class="tp">
        <button id="prevb" title="Previous (←)" aria-label="Previous">‹</button>
        <button id="nextb" title="Next (→ / space)" aria-label="Next">›</button>
        <button id="play" title="Play/pause animation (p)" aria-label="Play or pause">❚❚</button>
        <button id="stepb" title="Step (.)" aria-label="Step">⇥</button>
        <button id="resetb" title="Reset (r)" aria-label="Reset">↺</button>
        <button id="slower" title="Slower (-)" aria-label="Slower">−</button>
        <span id="speedo" class="mono" style="align-self:center;min-width:40px;text-align:center">1×</span>
        <button id="faster" title="Faster (+)" aria-label="Faster">+</button>
        <button id="notesb" title="Speaker notes (n)" aria-label="Speaker notes">✎</button>
        <button id="fs" title="Fullscreen (f)" aria-label="Fullscreen">⤢</button>
      </div>
    </footer>
    <div class="notes" id="notes" hidden></div>
  </div>
</div>

<script>
/* Seeded RNG: every slide reseeds on entry and on reset (r), so live runs replay identically. */
const SEED=42;let rngState=SEED;
function reseed(k=0){rngState=(SEED*2654435761+k*40503)>>>0}
Math.random=function(){let t=rngState=(rngState+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
/* ================= Environment ================= */
const LAYOUT=["....G",".#..L",".#.#.",".....","S.L.."];
const R=5,C=5,N=R*C,S0=4*C+0;
const ARW=['↑','→','↓','←'], DR=[-1,0,1,0], DC=[0,1,0,-1];
const typ=s=>LAYOUT[(s/C)|0][s%C];
const isWall=s=>typ(s)==='#', isTerm=s=>typ(s)==='G'||typ(s)==='L';
const rc=s=>[(s/C)|0,s%C], lbl=s=>`(${(s/C)|0},${s%C})`;
const ALL=[...Array(N).keys()], NT=ALL.filter(s=>!isWall(s)&&!isTerm(s));
const P={slip:0.1,gamma:0.9,temp:1,speed:1,horizon:10,sigma:0.5};
function move(s,a){const[r,c]=rc(s),nr=r+DR[a],nc=c+DC[a];if(nr<0||nr>=R||nc<0||nc>=C)return s;const s2=nr*C+nc;return isWall(s2)?s:s2}
const R_GOAL=10,R_LAVA=-50,R_STEP=-1;
const reward=s2=>typ(s2)==='G'?R_GOAL:typ(s2)==='L'?R_LAVA:R_STEP;
function trans(s,a){const m=new Map(),add=(b,p)=>{if(p<=0)return;const s2=move(s,b);m.set(s2,(m.get(s2)||0)+p)};
  add(a,1-P.slip);add((a+1)%4,P.slip/2);add((a+3)%4,P.slip/2);return[...m].map(([s2,p])=>({s2,p,r:reward(s2)}))}
function sampleMove(s,a){const u=Math.random();const act=u<1-P.slip?a:u<1-P.slip/2?(a+1)%4:(a+3)%4;return{act,s2:move(s,act)}}
function sampleCat(p){let u=Math.random();for(let i=0;i<p.length;i++){u-=p[i];if(u<=0)return i}return p.length-1}
const backup=(V,s,a)=>trans(s,a).reduce((q,{s2,p,r})=>q+p*(r+P.gamma*(isTerm(s2)?0:V[s2])),0);
function evalSweep(V,pi){const nv=V.slice();let d=0;for(const s of NT){let v=0;for(let a=0;a<4;a++)if(pi[s][a])v+=pi[s][a]*backup(V,s,a);d=Math.max(d,Math.abs(v-V[s]));nv[s]=v}return{V:nv,delta:d}}
function viSweep(V){const nv=V.slice();let d=0;for(const s of NT){const v=Math.max(...[0,1,2,3].map(a=>backup(V,s,a)));d=Math.max(d,Math.abs(v-V[s]));nv[s]=v}return{V:nv,delta:d}}
function converge(f){let V=new Array(N).fill(0);for(let i=0;i<20000;i++){const o=f(V);V=o.V;if(o.delta<1e-8)break}return V}
const qFrom=V=>ALL.map(s=>NT.includes(s)?[0,1,2,3].map(a=>backup(V,s,a)):[0,0,0,0]);
const argmax=q=>{let b=0;for(let a=1;a<4;a++)if(q[a]>q[b]+1e-9)b=a;return b};
let M=null;
function model(){
  if(M)return M;
  const Vs=converge(viSweep),Qs=qFrom(Vs);
  const pi={random:ALL.map(()=>[.25,.25,.25,.25]),
    greedy:ALL.map(s=>{const p=[0,0,0,0];p[argmax(Qs[s])]=1;return p}),
    soft:ALL.map(s=>{const q=Qs[s],m=Math.max(...q),e=q.map(x=>Math.exp((x-m)/P.temp)),z=e.reduce((a,b)=>a+b);return e.map(x=>x/z)})};
  return M={Vs,Qs,pi,Vpi:{},Qpi:{}};
}
function Vpi(k){const m=model();if(!m.Vpi[k]){m.Vpi[k]=converge(V=>evalSweep(V,m.pi[k]));m.Qpi[k]=qFrom(m.Vpi[k])}return m.Vpi[k]}
function Qpi(k){Vpi(k);return M.Qpi[k]}
function invalidate(){M=null;scenes[cur].onModel&&scenes[cur].onModel()}
const fmt=(v,d=1)=>{if(Math.abs(v)<.5*10**-d)v=0;return(v<0?'−':'')+Math.abs(v).toFixed(d)};
const sgn=v=>v>0?'pos':v<0?'neg':'';
const PNAME={random:'Random',soft:'Softmax',greedy:'Greedy'};

/* ================= Agent runner ================= */
const MOVE=.5,GAP=.25;
class Runner{
  constructor(o){this.o=o;this.reset()}
  reset(){Object.assign(this,{s:S0,t:0,steps:[],from:S0,to:S0,prog:1,wait:.5,done:false,trail:[S0],bump:-1,age:99})}
  step(){
    if(this.done){this.o.onEnd&&this.o.onEnd(this);this.reset();return}
    const a=sampleCat(this.o.pi()[this.s]);const{act,s2}=sampleMove(this.s,a);const r=reward(s2);
    const st={t:this.t,s:this.s,a,act,s2,r};this.steps.push(st);
    Object.assign(this,{from:this.s,to:s2,prog:0,age:0,bump:s2===this.s?act:-1,s:s2});this.t++;this.trail.push(s2);
    this.o.onStep&&this.o.onStep(this,st);
    const H=this.o.horizon?this.o.horizon():120;
    if(isTerm(s2)||this.t>=H)this.done=true;
    this.wait=this.done?(this.o.hold||1.2):GAP;
  }
  update(dt,play){this.age+=dt*P.speed;if(this.prog<1){this.prog=Math.min(1,this.prog+dt*P.speed/MOVE);return}
    if(!play)return;this.wait-=dt*P.speed;if(this.wait<=0)this.step()}
  manual(){this.prog=1;this.step()}
  pos(){const e=1-Math.pow(1-this.prog,3),[r1,c1]=rc(this.from),[r2,c2]=rc(this.to);let r=r1+(r2-r1)*e,c=c1+(c2-c1)*e;
    if(this.bump>=0){const k=Math.sin(Math.PI*this.prog)*.22;r+=DR[this.bump]*k;c+=DC[this.bump]*k}return{r,c}}
}

/* ================= Canvas ================= */
const cv=document.getElementById('cv'),g=cv.getContext('2d'),stage=document.getElementById('stage');
let W=0,H=0,geo={ox:0,oy:0,cs:1},tk={},SCALE=1;
function resize(){const d=(devicePixelRatio||1)*SCALE;W=stage.clientWidth;H=stage.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);
  const cs=Math.floor(Math.min(W,H)/5.05);geo={cs,ox:Math.round((W-cs*C)/2),oy:Math.round((H-cs*R)/2)}}
new ResizeObserver(resize).observe(stage);
function readTokens(){const cs=getComputedStyle(document.documentElement),o={};for(const k of['bg','surface','ink','muted','line','cell','wall','agent','pos','neg','hl'])o[k]=cs.getPropertyValue('--'+k).trim();tk=o}
const rgba=(h,a)=>{h=h.replace('#','');if(h.length===3)h=[...h].map(x=>x+x).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const center=s=>{const[r,c]=rc(s);return{x:geo.ox+(c+.5)*geo.cs,y:geo.oy+(r+.5)*geo.cs}};
const toXY=(r,c)=>({x:geo.ox+(c+.5)*geo.cs,y:geo.oy+(r+.5)*geo.cs});
function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
const font=(w,sz,f='mono')=>`${w} ${Math.round(sz)}px ${f==='mono'?'"IBM Plex Mono",ui-monospace,monospace':'"IBM Plex Sans",system-ui,sans-serif'}`;
function text(t,x,y,col,sz,w=600,f='mono',al='center'){g.fillStyle=col;g.font=font(w,sz,f);g.textAlign=al;g.textBaseline='middle';g.fillText(t,x,y)}
function arrow(x1,y1,x2,y2,w,col){const a=Math.atan2(y2-y1,x2-x1),h=Math.max(6,w*2.6);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.7,y2-Math.sin(a)*h*.7);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45));g.lineTo(x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45));g.closePath();g.fill()}
function heatCol(v,scale){return rgba(v>=0?tk.pos:tk.neg,Math.min(1,Math.abs(v)/scale)*.62)}

function drawWorld(o={}){
  const{ox,oy,cs}=geo,pad=Math.max(1.5,cs*.025);
  const hv=o.heat?NT.map(s=>o.heat[s]):[0],hsP=o.heatScale||Math.max(5,...hv),hsN=o.heatScale||Math.max(5,...hv.map(v=>-v));
  g.clearRect(0,0,W,H);
  for(const s of ALL){const[r,c]=rc(s),x=ox+c*cs,y=oy+r*cs,t=typ(s);
    rr(x+pad,y+pad,cs-2*pad,cs-2*pad,cs*.07);
    if(t==='#'){g.fillStyle=tk.wall;g.fill();g.save();g.clip();g.strokeStyle=rgba(tk.bg,.18);g.lineWidth=2;
      for(let k=-cs;k<cs;k+=cs/6){g.beginPath();g.moveTo(x+k,y+cs);g.lineTo(x+k+cs,y);g.stroke()}g.restore();continue}
    if(t==='G'||t==='L'){const col=t==='G'?tk.pos:tk.neg;g.fillStyle=tk.cell;g.fill();g.fillStyle=rgba(col,.22);g.fill();g.strokeStyle=col;g.lineWidth=2.5;g.stroke();

const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

  ct.step=()=>{if(ct.done){ct.reset();return}const s=cellOf(ct.x,ct.y),ga=argmax(model().Qs[s]);ct.mu=[DC[ga],DR[ga]];
    const one=()=>{const z=[gauss(),gauss()];return{z,raw:[ct.mu[0]+P.sigma*z[0],ct.mu[1]+P.sigma*z[1]]}};
    const f=one();ct.z=f.z;ct.raw=f.raw;ct.a=f.raw.map(clip);ct.samples=Array.from({length:29},()=>one().raw.map(clip));ct.stepped=true;
    let nx=ct.x+.45*ct.a[0],ny=ct.y+.45*ct.a[1];const s2=cellOf(nx,ny);ct.bump=s2<0||isWall(s2);if(ct.bump){nx=ct.x;ny=ct.y}
    Object.assign(ct,{fx:ct.x,fy:ct.y,x:nx,y:ny,prog:0});ct.t++;if((!ct.bump&&isTerm(s2))||ct.t>150)ct.done=true;ct.wait=ct.done?1.1:GAP*.4};
  ct.update=(dt,play)=>{if(ct.prog<1){ct.prog=Math.min(1,ct.prog+dt*P.speed/(MOVE*.6));return}if(!play)return;ct.wait-=dt*P.speed;if(ct.wait<=0)ct.step()};
  ct.manual=()=>{ct.prog=1;ct.step()};
  ct.draw=()=>{const e=1-Math.pow(1-ct.prog,3),x=ct.fx+(ct.x-ct.fx)*e,y=ct.fy+(ct.y-ct.fy)*e,L=geo.cs*.9,bx=geo.ox+ct.fx*geo.cs,by=geo.oy+ct.fy*geo.cs;

  upd(s,a,r,s2,term,al){const tgt=r+(term?0:P.gamma*Math.max(...this.Q[s2]));this.Q[s][a]+=al*(tgt-this.Q[s][a])},
  observe(s,a,r,s2,term){this.upd(s,a,r,s2,term,this.alpha);this.last=[s,a];if(this.replay){this.buf.push([s,a,r,s2,term]);if(this.buf.length>5000)this.buf.shift();

  pi(){return greedyOf(this.Q)},V(){return this.Q.map(q=>Math.max(...q))}});
const L_PG=()=>({alpha:.1,beta:.1,init(){this.th=zeros4();this.Vb=new Array(N).fill(0);this.ep=[]},
  act(s){return sampleCat(softmax(this.th[s]))},observe(s,a,r){this.ep.push([s,a,r])},
  endEpisode(){let G=0;for(let i=this.ep.length-1;i>=0;i--){const[s,a,r]=this.ep[i];G=r+P.gamma*G;const A=G-this.Vb[s];this.Vb[s]+=this.beta*(G-this.Vb[s]);

  pi(){return ALL.map(s=>softmax(this.th[s]))},V(){return this.Vb}});
const L_AC=()=>({alpha:.1,beta:.2,init(){this.th=zeros4();this.Vc=new Array(N).fill(0);this.delta=0},
  act(s){return sampleCat(softmax(this.th[s]))},
  observe(s,a,r,s2,term){const d=r+(term?0:P.gamma*this.Vc[s2])-this.Vc[s];this.delta=d;this.Vc[s]+=this.beta*d;const p=softmax(this.th[s]);for(let b=0;b<4;b++)this.th[s][b]+=this.alpha*d*((b===a)-p[b])},
  pi(){return ALL.map(s=>softmax(this.th[s]))},V(){return this.Vc}});
const L_Model=()=>({eps:.05,init(){this.cnt=ALL.map(()=>[0,1,2,3].map(()=>new Map()));this.tot=zeros4();this.Vm=new Array(N).fill(0);this.Qm=zeros4()},
  model(s,a){const t=this.tot[s][a];if(!t)return[{s2:s,p:1,r:0}];return[...this.cnt[s][a]].map(([s2,c])=>({s2,p:c/t,r:reward(s2)}))},
  plan(sweeps=6){for(let k=0;k<sweeps;k++){const nv=this.Vm.slice();for(const s of NT){for(let a=0;a<4;a++)this.Qm[s][a]=this.model(s,a).reduce((q,{s2,p,r})=>q+p*(r+P.gamma*(isTerm(s2)?0:this.Vm[s2])),0);nv[s]=Math.max(...this.Qm[s])}this.Vm=nv}},
  act(s){return Math.random()<this.eps?(Math.random()*4)|0:argmax(this.Qm[s])},
  observe(s,a,r,s2){const m=this.cnt[s][a];m.set(s2,(m.get(s2)||0)+1);this.tot[s][a]++;this.plan()},
  known(){return NT.reduce((k,s)=>k+this.tot[s].filter(x=>x>0).length,0)},
  err(){let e=0,n=0;for(const s of NT)for(let a=0;a<4;a++){if(!this.tot[s][a])continue;n++;const tp=new Map(trans(s,a).map(x=>[x.s2,x.p]));const keys=new Set([...tp.keys(),...this.cnt[s][a].keys()]);

/* 7 — the RL problem */
{let kind='random',rets=[],visits=new Array(N).fill(0),last=[];
const reset=()=>{rets=[];visits=new Array(N).fill(0);last=[]};
function rollout(){const pi=model().pi[kind];let s=S0,G=0,d=1,t=0;const tr=[s];while(!isTerm(s)&&t<200){visits[s]++;const{s2}=sampleMove(s,sampleCat(pi[s]));G+=d*reward(s2);d*=P.gamma;s=s2;t++;tr.push(s)}rets.push(G);last=tr}
let acc=0;
scenes.push({kicker:'Key concepts',title:'The RL problem',
  points:['The return is random: it depends on the policy and on the environment.','So we maximize the <b>expected</b> return:',EQ(`<div><i>J</i>(π) = E<sub>τ∼π</sub>[ <i>R</i>(τ) ]</div><div>π* = arg max<sub>π</sub> <i>J</i>(π)</div>`)],
  notes:'Each tick runs a dozen episodes. Blue shading = where the agent spends time. The yellow line (sample average) converges to the dashed line (exact J). Compare Random vs Greedy.',
  controls:()=>[kindSeg(()=>kind,v=>{kind=v;reset()}),gammaCtl,slipCtl],
  onModel:reset,enter:reset,reset,step:rollout,
  update(dt){if(!playing)return;acc+=dt*P.speed*12;while(acc>=1){acc--;rollout()}},
  panelCanvas:true,
  draw(){const vm=Math.max(...visits);drawWorld({visits,vmax:vm,trails:last.length?[last]:[],trailCol:tk.hl,trailAlpha:()=>.9})},
  drawPanel(pg,w,h){pg.clearRect(0,0,w,h);const lo=-60,hi=10,nb=35,bins=new Array(nb).fill(0);for(const r of rets){const b=Math.max(0,Math.min(nb-1,Math.floor((r-lo)/(hi-lo)*nb)));bins[b]++}
    const mx=Math.max(1,...bins),pl=8,pr=8,pt=22,pb=26,bw=(w-pl-pr)/nb,X=v=>pl+(v-lo)/(hi-lo)*(w-pl-pr);
    pg.strokeStyle=tk.line;pg.beginPath();pg.moveTo(pl,h-pb);pg.lineTo(w-pr,h-pb);pg.stroke();
    bins.forEach((c,i)=>{const bh=(h-pt-pb)*c/mx;pg.fillStyle=rgba(tk.agent,.75);pg.fillRect(pl+i*bw+1,h-pb-bh,bw-2,bh)});
    pg.fillStyle=tk.muted;pg.font=font(400,13);pg.textAlign='center';pg.textBaseline='top';for(const v of[-60,-40,-20,0])pg.fillText(fmt(v,0),Math.min(w-pr-10,Math.max(pl+10,X(v))),h-pb+6);
    const J=Vpi(kind)[S0];pg.setLineDash([5,4]);pg.strokeStyle=tk.ink;pg.lineWidth=1.5;pg.beginPath();pg.moveTo(X(J),pt-2);pg.lineTo(X(J),h-pb);pg.stroke();pg.setLineDash([]);
    pg.textBaseline='bottom';pg.fillStyle=tk.ink;pg.fillText('exact J',Math.min(w-30,Math.max(30,X(J))),pt-4);
    if(rets.length){const m=rets.reduce((a,b)=>a+b)/rets.length;pg.strokeStyle=tk.hl;pg.lineWidth=3;pg.beginPath();pg.moveTo(X(m),pt+10);pg.lineTo(X(m),h-pb);pg.stroke()}},
  live(){const n=rets.length,m=n?rets.reduce((a,b)=>a+b)/n:0;return`<div class="stats"><div><div class="muted">episodes</div><div class="big">${n}</div></div><div><div class="muted">average R(τ)</div><div class="big" style="color:var(--hl)">${n?fmt(m,2):'—'}</div></div><div><div class="muted">exact J(π)</div><div class="big">${fmt(Vpi(kind)[S0],2)}</div></div></div>`}})}

{let kind='random',show='V',V=new Array(N).fill(0),k=0,delta=0,acc=0;const reset=()=>{V=new Array(N).fill(0);k=0;delta=0};
const sweep=()=>{const o=evalSweep(V,model().pi[kind]);V=o.V;delta=o.delta;k++};
scenes.push({kicker:'Key concepts',title:'Value functions',
  points:['How good is it to be here, if I follow π from now on?',EQ(`<div><i>V</i><sup>π</sup>(<i>s</i>) = E<sub>τ∼π</sub>[ <i>R</i>(τ) | <i>s</i><sub>0</sub>=<i>s</i> ]</div><div><i>Q</i><sup>π</sup>(<i>s</i>,<i>a</i>) = E<sub>τ∼π</sub>[ <i>R</i>(τ) | <i>s</i><sub>0</sub>=<i>s</i>, <i>a</i><sub>0</sub>=<i>a</i> ]</div>`),'<i>Q</i> fixes the first action, then follows π.'],
  notes:'Play runs iterative policy evaluation: each sweep spreads value one more step out from the goal and the lava. Random π: cells near lava are badly negative. Switch to Greedy: the whole map turns positive. Toggle Q to see four triangles per cell.',

  points:['='+`∇<sub><i>θ</i></sub><i>J</i> = E[ Σ<sub><i>t</i></sub> ∇<sub><i>θ</i></sub> log <i>π<sub>θ</sub></i>(<i>a<sub>t</sub></i>|<i>s<sub>t</sub></i>) <i>Φ<sub>t</sub></i> ]`,'~'+`<i>Φ<sub>t</sub></i> can be: <i>R</i>(τ) · <i>R̂<sub>t</sub></i> · <i>R̂<sub>t</sub></i> − <i>b</i>(<i>s<sub>t</sub></i>) · <i>Q</i><sup>π</sup>(<i>s<sub>t</sub></i>,<i>a<sub>t</sub></i>) · <i>A</i><sup>π</sup>(<i>s<sub>t</sub></i>,<i>a<sub>t</sub></i>)`,'All give the same expected gradient. They differ in variance, which sets how fast you learn.','Using the advantage <i>A</i><sup>π</sup> gives Vanilla Policy Gradient (VPG). GAE is a good way to estimate it.'],
  notes:'Three learners, three seeds each, same learning rate, 10 episodes per epoch; only Φ differs. R(τ) is slowest; reward-to-go removes the noise of past rewards; the learned baseline removes more. Early on the baseline is still being learned, so it can briefly trail plain reward-to-go.',
  controls:()=>[],enter:reset,reset,onModel:reset,
  step(){if(Ls[0][0].epoch<XMAX)Ls.flat().forEach(l=>l.trainEpoch())},
  update(dt){if(!playing)return;acc+=dt*P.speed*15;while(acc>=1&&Ls[0][0].epoch<XMAX){acc--;Ls.flat().forEach(l=>l.trainEpoch())}if(Ls[0][0].epoch>=XMAX)acc=0},
  draw(){g.clearRect(0,0,W,H);chart(g,W,H,KINDS.map(([k,lab,col],i)=>({c:avgCurve(Ls[i]),col:col(),label:lab})),{xMax:XMAX,lo:-60,hi:10,ticks:[-60,-40,-20,0],xlabel:'epochs (10 episodes each)',ref:V1star()[S0],win:10,fs:17,lw:3.5,pr:20})},
  live(){const f=i=>{const c=avgCurve(Ls[i]).slice(-10);return c.length?fmt(c.reduce((s,p)=>s+p.y,0)/c.length,1):'—'};
    return`<div class="stats">${KINDS.map(([k,lab,col],i)=>`<div><div class="muted">${lab}</div><div class="big" style="color:${col()}">${f(i)}</div></div>`).join('')}</div><div class="muted">epoch ${Ls[0][0].epoch} of ${XMAX}</div>`}})}

/* Closing */
{const run=new Runner({pi:()=>model().pi.greedy});
scenes.push({kicker:'What’s next',title:'Now: the notebook',
  points:['Same algorithm, bigger world: CartPole’s observation is 4 numbers, with 2 actions.','The table of logits becomes a small neural network: <span class="mono">logits_net</span>.','Start with weights = <i>R</i>(τ), then switch to reward-to-go and compare the learning curves.','Next in Spinning Up: VPG, TRPO and PPO.'],
  notes:'Hand off to 1_policy_grad.ipynb. Exercise: replace batch_weights += [ep_ret] * ep_len with reward-to-go and compare. The robot here follows the optimal policy.',
  controls:()=>[],enter(){run.reset()},update:dt=>run.update(dt,playing),step:()=>run.manual(),reset:()=>run.reset(),
  draw(){const m=model();drawWorld({heat:m.Vs,pi:m.pi.greedy});drawTrail(run);drawAgent(run.pos())}})}

const SHOW_PART2=false;
if(!SHOW_PART2)scenes.splice(P2_START,P2_END-P2_START);

/* ================= Deck UI ================= */
let cur=0,build=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
function fit(){const vp=$('vp');SCALE=Math.min(vp.clientWidth/1600,vp.clientHeight/900);$('deck').style.setProperty('--s',SCALE);resize()}
addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fs',!!document.fullscreenElement);setTimeout(fit,50)});
function renderControls(){const sc=scenes[cur],list=sc.controls();$('controls').innerHTML=list.map((c,i)=>c.type==='seg'
  ?`<div class="ctl"><span class="lab">${c.label}</span><div class="seg" role="group">${c.opts.map(([v,l])=>`<button data-c="${i}" data-v="${v}" aria-pressed="${c.get()===v}">${l.replace(/\^π/g,'<sup>π</sup>')}</button>`).join('')}</div></div>`
  :`<div class="ctl"><label for="c${cur}_${i}">${c.label}<output>${c.fmt(c.get())}</output></label><input type="range" id="c${cur}_${i}" data-c="${i}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.get()}"></div>`).join('');
  $('controls').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{list[+b.dataset.c].set(b.dataset.v);renderControls();b.blur()});
  $('controls').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const c=list[+inp.dataset.c];c.set(+inp.value);inp.previousElementSibling.querySelector('output').textContent=c.fmt(+inp.value)})}
function showBuild(){$('pts').querySelectorAll('.pt').forEach((p,i)=>p.classList.toggle('on',i<=build))}
function go(i,full=false){if(i<0||i>=scenes.length)return;cur=i;const sc=scenes[cur];floats=[];
  $('sh').hidden=!!sc.cover;$('kicker').textContent=sc.kicker;$('title').textContent=sc.title;
  $('pts').innerHTML=sc.cover?`<li>${sc.coverHtml}</li>`:sc.points.map(p=>p[0]==='='?`<li class="pt eq">${p.slice(1)}</li>`:p[0]==='~'?`<li class="pt eq sm">${p.slice(1)}</li>`:`<li class="pt txt">${p}</li>`).join('');
  $('left').classList.toggle('cover',!!sc.cover);
  $('visual').hidden=!sc.visual;$('stage').hidden=!!sc.visual;$('visual').innerHTML=sc.visual||'';
  let part='';for(let j=cur;j>=0;j--)if(scenes[j].part){part=scenes[j].part;break}$('partlbl').textContent=part;
  build=full?Math.max(0,sc.points.length-1):0;showBuild();
  $('left').classList.remove('anim');void $('left').offsetWidth;$('left').classList.add('anim');
  $('extra').innerHTML=(sc.extra||'')+(sc.panelCanvas?'<canvas class="pc" id="pc"></canvas>':'');lastLive='';renderControls();reseed(cur);sc.enter&&sc.enter();
  $('notes').innerHTML=`<b>Speaker notes</b>${sc.notes||''}`;
  $('count').textContent=`${cur+1} / ${scenes.length}`;$('progbar').style.width=`${(cur+1)/scenes.length*100}%`;
  sc.onBuild&&sc.onBuild(build);
  cv.style.cursor=sc.click?'pointer':'default';try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}}
function next(){const sc=scenes[cur],n=sc.points.length;if(build<n-1){build++;showBuild();sc.onBuild&&sc.onBuild(build)}else go(cur+1)}
function prev(){const sc=scenes[cur];if(build>0){build--;showBuild();sc.onBuild&&sc.onBuild(build)}else go(cur-1,true)}
function setPlay(v){playing=v;$('play').textContent=playing?'❚❚':'▶'}
function setSpeed(v){P.speed=Math.max(.25,Math.min(6,v));$('speedo').textContent=P.speed+'×'}
$('nextb').onclick=next;$('prevb').onclick=prev;
$('play').onclick=()=>setPlay(!playing);
$('stepb').onclick=()=>scenes[cur].step&&scenes[cur].step();
$('resetb').onclick=()=>{floats=[];reseed(cur);scenes[cur].reset&&scenes[cur].reset()};
$('slower').onclick=()=>setSpeed(P.speed/2);$('faster').onclick=()=>setSpeed(P.speed*2);
$('notesb').onclick=()=>$('notes').hidden=!$('notes').hidden;
$('fs').onclick=()=>{const d=document;(d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen?.())?.catch?.(()=>{})};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='ArrowDown'){next();e.preventDefault()}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='ArrowUp'){prev();e.preventDefault()}
  else if(k==='Home')go(0);else if(k==='End')go(scenes.length-1,true);
  else if(k==='p')setPlay(!playing);else if(k==='.')$('stepb').click();else if(k==='r')$('resetb').click();
  else if(k==='f')$('fs').click();else if(k==='n')$('notesb').click();else if(k==='+'||k==='=')setSpeed(P.speed*2);else if(k==='-')setSpeed(P.speed/2);
  else if(k==='Escape')$('notes').hidden=true});
cv.addEventListener('click',e=>{const sc=scenes[cur];if(!sc.click)return;const b=cv.getBoundingClientRect(),c=Math.floor(((e.clientX-b.left)/SCALE-geo.ox)/geo.cs),r=Math.floor(((e.clientY-b.top)/SCALE-geo.oy)/geo.cs);
  if(r<0||r>=R||c<0||c>=C)return;const s=r*C+c;if(!isWall(s)&&!isTerm(s))sc.click(s)});
let lastLive='',last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;readTokens();const sc=scenes[cur];
  sc.update&&sc.update(dt);if(W>0)sc.draw(dt);sc.dom&&sc.dom();
  if(sc.panelCanvas){const pc=$('pc');if(pc){const d=(devicePixelRatio||1)*SCALE,w=pc.clientWidth,h=pc.clientHeight;if(pc.width!==Math.round(w*d)){pc.width=Math.round(w*d);pc.height=Math.round(h*d)}const pg=pc.getContext('2d');pg.setTransform(d,0,0,d,0,0);sc.drawPanel(pg,w,h)}}
  const html=sc.live?sc.live():'';if(html!==lastLive){$('live').innerHTML=html;lastLive=html}
  requestAnimationFrame(frame)}
setPlay(playing);fit();
const h=/^#s(\d+)$/.exec(location.hash);go(h?Math.min(scenes.length,+h[1])-1:0);
requestAnimationFrame(frame);
</script>
